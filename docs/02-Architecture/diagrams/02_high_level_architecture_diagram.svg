<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="1000" height="750" fill="#fafafa"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold">High-Level Architecture Diagram</text>

<rect x="60" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#2b6cb0"/><text x="160" y="90" text-anchor="middle" font-size="13">Next.js Web (Public/Member/Admin)</text>
<rect x="400" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#2b6cb0"/><text x="500" y="90" text-anchor="middle" font-size="13">Flutter Mobile App</text>
<rect x="740" y="60" width="200" height="50" rx="8" fill="#bee3f8" stroke="#2b6cb0"/><text x="840" y="90" text-anchor="middle" font-size="13">MCP / AI Clients</text>

<line x1="160" y1="110" x2="450" y2="170" stroke="#555" marker-end="url(#arrow)"/>
<line x1="500" y1="110" x2="480" y2="170" stroke="#555" marker-end="url(#arrow)"/>
<line x1="840" y1="110" x2="560" y2="170" stroke="#555" marker-end="url(#arrow)"/>

<rect x="330" y="170" width="340" height="60" rx="8" fill="#2b6cb0"/><text x="500" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">TheOne.API (JWT / HTTPS / Rate Limiting)</text>

<line x1="500" y1="230" x2="500" y2="270" stroke="#555" marker-end="url(#arrow)"/>
<rect x="330" y="270" width="340" height="50" rx="8" fill="#4299e1"/><text x="500" y="300" text-anchor="middle" fill="white" font-size="13">Application Layer (CQRS / Use Cases)</text>

<line x1="500" y1="320" x2="500" y2="360" stroke="#555" marker-end="url(#arrow)"/>
<rect x="330" y="360" width="340" height="50" rx="8" fill="#63b3ed"/><text x="500" y="390" text-anchor="middle" fill="white" font-size="13">Domain Layer (Entities / Business Rules)</text>

<line x1="500" y1="410" x2="500" y2="450" stroke="#555" marker-end="url(#arrow)"/>
<rect x="200" y="450" width="600" height="50" rx="8" fill="#90cdf4"/><text x="500" y="480" text-anchor="middle" font-size="13">Infrastructure / Persistence / Identity / McpServer / Worker</text>

<line x1="330" y1="500" x2="200" y2="560" stroke="#555" marker-end="url(#arrow)"/>
<line x1="450" y1="500" x2="400" y2="560" stroke="#555" marker-end="url(#arrow)"/>
<line x1="560" y1="500" x2="600" y2="560" stroke="#555" marker-end="url(#arrow)"/>
<line x1="670" y1="500" x2="800" y2="560" stroke="#555" marker-end="url(#arrow)"/>

<rect x="80" y="560" width="180" height="55" rx="8" fill="#edf2f7" stroke="#4a5568"/><text x="170" y="585" text-anchor="middle" font-size="12" font-weight="bold">PostgreSQL</text><text x="170" y="602" text-anchor="middle" font-size="11">Metadata + Content</text>

<rect x="310" y="560" width="180" height="55" rx="8" fill="#edf2f7" stroke="#4a5568"/><text x="400" y="585" text-anchor="middle" font-size="12" font-weight="bold">Redis</text><text x="400" y="602" text-anchor="middle" font-size="11">Cache + Pub/Sub</text>

<rect x="510" y="560" width="180" height="55" rx="8" fill="#edf2f7" stroke="#4a5568"/><text x="600" y="585" text-anchor="middle" font-size="12" font-weight="bold">Object Storage</text><text x="600" y="602" text-anchor="middle" font-size="11">Books / Images (behind CDN)</text>

<rect x="710" y="560" width="180" height="55" rx="8" fill="#edf2f7" stroke="#4a5568"/><text x="800" y="585" text-anchor="middle" font-size="12" font-weight="bold">bKash MFS</text><text x="800" y="602" text-anchor="middle" font-size="11">Payment Webhook</text>

<rect x="200" y="660" width="600" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="500" y="690" text-anchor="middle" font-size="13">Background Workers (TheOne.Worker) - Bijoy Conversion, QC, Notifications</text>
