<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="1100" height="800" fill="#fafafa"/>
<text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold">Database ER Diagram (Simplified)</text>

<g font-size="11">
<!-- Identity/Access cluster -->
<rect x="30" y="70" width="170" height="80" rx="6" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="115" y="90" text-anchor="middle" font-weight="bold">User</text>
<text x="115" y="106" text-anchor="middle">Id, Email, PasswordHash</text>
<text x="115" y="121" text-anchor="middle">MfaEnabled</text>
<text x="115" y="136" text-anchor="middle">-&gt; UserProfile 1:1</text>

<rect x="240" y="70" width="170" height="80" rx="6" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="325" y="90" text-anchor="middle" font-weight="bold">Role</text>
<text x="325" y="106" text-anchor="middle">Id, Name</text>
<text x="325" y="121" text-anchor="middle">-&gt; UserRole M:N User</text>

<rect x="450" y="70" width="170" height="95" rx="6" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="535" y="90" text-anchor="middle" font-weight="bold">Permission / Menu</text>
<text x="535" y="106" text-anchor="middle">RoleMenuPermission</text>
<text x="535" y="121" text-anchor="middle">UserPermissionOverride</text>
<text x="535" y="136" text-anchor="middle">View/Create/Edit/Delete/</text>
<text x="535" y="151" text-anchor="middle">Approve/Export</text>

<!-- Membership cluster -->
<rect x="30" y="220" width="170" height="80" rx="6" fill="#c6f6d5" stroke="#2f855a"/>
<text x="115" y="240" text-anchor="middle" font-weight="bold">Member</text>
<text x="115" y="256" text-anchor="middle">Id, UserId (FK)</text>
<text x="115" y="271" text-anchor="middle">Status, JoinedAt</text>
<text x="115" y="286" text-anchor="middle">-&gt; MembershipApplication 1:N</text>

<rect x="240" y="220" width="170" height="80" rx="6" fill="#c6f6d5" stroke="#2f855a"/>
<text x="325" y="240" text-anchor="middle" font-weight="bold">MembershipApplication</text>
<text x="325" y="256" text-anchor="middle">Id, MemberId (FK)</text>
<text x="325" y="271" text-anchor="middle">Status, ApprovedBy</text>

<rect x="450" y="220" width="170" height="95" rx="6" fill="#c6f6d5" stroke="#2f855a"/>
<text x="535" y="240" text-anchor="middle" font-weight="bold">PaymentTransaction</text>
<text x="535" y="256" text-anchor="middle">Id, ApplicationId (FK)</text>
<text x="535" y="271" text-anchor="middle">BkashTransactionId</text>
<text x="535" y="286" text-anchor="middle">(idempotency key), Status</text>

<!-- Library cluster -->
<rect x="30" y="380" width="150" height="65" rx="6" fill="#fefcbf" stroke="#b7791f"/>
<text x="105" y="400" text-anchor="middle" font-weight="bold">Book</text>
<text x="105" y="416" text-anchor="middle">Id, Title, Author</text>

<rect x="220" y="380" width="150" height="65" rx="6" fill="#fefcbf" stroke="#b7791f"/>
<text x="295" y="400" text-anchor="middle" font-weight="bold">Volume</text>
<text x="295" y="416" text-anchor="middle">Id, BookId (FK)</text>

<rect x="410" y="380" width="150" height="65" rx="6" fill="#fefcbf" stroke="#b7791f"/>
<text x="485" y="400" text-anchor="middle" font-weight="bold">Chapter</text>
<text x="485" y="416" text-anchor="middle">Id, VolumeId (FK)</text>

<rect x="600" y="380" width="170" height="80" rx="6" fill="#fefcbf" stroke="#b7791f"/>
<text x="685" y="400" text-anchor="middle" font-weight="bold">ContentBlock</text>
<text x="685" y="416" text-anchor="middle">Id, ChapterId (FK)</text>
<text x="685" y="431" text-anchor="middle">UnicodeText, ReviewStatus</text>

<rect x="810" y="380" width="170" height="80" rx="6" fill="#fefcbf" stroke="#b7791f"/>
<text x="895" y="400" text-anchor="middle" font-weight="bold">ContentVersion</text>
<text x="895" y="416" text-anchor="middle">Id, ContentBlockId (FK)</text>
<text x="895" y="431" text-anchor="middle">VersionNo (max 5), ApproverId</text>

<!-- CMS + shared -->
<rect x="30" y="510" width="150" height="65" rx="6" fill="#fed7d7" stroke="#c53030"/>
<text x="105" y="530" text-anchor="middle" font-weight="bold">Article</text>
<text x="105" y="546" text-anchor="middle">Id, AuthorId (FK)</text>

<rect x="220" y="510" width="150" height="65" rx="6" fill="#fed7d7" stroke="#c53030"/>
<text x="295" y="530" text-anchor="middle" font-weight="bold">Media</text>
<text x="295" y="546" text-anchor="middle">Id, StorageRef, Type</text>

<rect x="410" y="510" width="150" height="65" rx="6" fill="#e2e8f0" stroke="#4a5568"/>
<text x="485" y="530" text-anchor="middle" font-weight="bold">AuditLog</text>
<text x="485" y="546" text-anchor="middle">Id, ActorId, Action</text>
</g>

<text x="550" y="650" text-anchor="middle" font-size="12" fill="#333">Full attribute list, keys, and indexes belong in the Database Design Document (/docs/database.md).</text>
<text x="550" y="670" text-anchor="middle" font-size="12" fill="#333">This view shows entity groupings and primary FK relationships only.</text>
</svg>
