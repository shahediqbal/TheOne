<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="1000" height="700" fill="#fafafa"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold">System Context Diagram - The One Project</text>

<rect x="370" y="290" width="260" height="120" rx="10" fill="#2b6cb0"/>
<text x="500" y="345" text-anchor="middle" fill="white" font-size="16" font-weight="bold">The One Project</text>
<text x="500" y="368" text-anchor="middle" fill="white" font-size="12">Digital Archive, CMS, Membership,</text>
<text x="500" y="384" text-anchor="middle" fill="white" font-size="12">Research &amp; AI Platform</text>

<!-- actors -->
<g font-size="12">
<rect x="40" y="60" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="130" y="85" text-anchor="middle" font-weight="bold">Public Visitor</text>
<text x="130" y="102" text-anchor="middle">Browses website, reads content</text>

<rect x="40" y="320" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="130" y="345" text-anchor="middle" font-weight="bold">Member</text>
<text x="130" y="362" text-anchor="middle">Registers, pays, reads library</text>

<rect x="40" y="580" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="130" y="605" text-anchor="middle" font-weight="bold">Content Specialist</text>
<text x="130" y="622" text-anchor="middle">Uploads &amp; reviews books</text>

<rect x="780" y="60" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="870" y="85" text-anchor="middle" font-weight="bold">Admin / Staff</text>
<text x="870" y="102" text-anchor="middle">Approvals, permissions, CMS</text>

<rect x="780" y="320" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="870" y="345" text-anchor="middle" font-weight="bold">bKash MFS</text>
<text x="870" y="362" text-anchor="middle">Payment gateway (webhook)</text>

<rect x="780" y="580" width="180" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="870" y="605" text-anchor="middle" font-weight="bold">MCP / AI Client</text>
<text x="870" y="622" text-anchor="middle">Read-only research queries</text>

<rect x="400" y="580" width="200" height="60" rx="8" fill="#edf2f7" stroke="#4a5568"/>
<text x="500" y="605" text-anchor="middle" font-weight="bold">Mobile App (Flutter)</text>
<text x="500" y="622" text-anchor="middle">Reader &amp; member app</text>
</g>

<!-- connectors -->
<line x1="220" y1="90" x2="380" y2="300" stroke="#555" marker-end="url(#arrow)"/>
<line x1="220" y1="350" x2="370" y2="350" stroke="#555" marker-end="url(#arrow)"/>
<line x1="220" y1="605" x2="420" y2="410" stroke="#555" marker-end="url(#arrow)"/>
<line x1="780" y1="90" x2="620" y2="300" stroke="#555" marker-end="url(#arrow)"/>
<line x1="630" y1="350" x2="780" y2="350" stroke="#555" marker-end="url(#arrow)"/>
<line x1="780" y1="605" x2="600" y2="410" stroke="#555" marker-end="url(#arrow)"/>
<line x1="500" y1="580" x2="500" y2="410" stroke="#555" marker-end="url(#arrow)"/>
</svg>
