<svg viewBox="0 0 950 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="950" height="500" fill="#fafafa"/>
<text x="475" y="30" text-anchor="middle" font-size="20" font-weight="bold">Authentication Flow Diagram</text>

<g font-size="12">
<rect x="30" y="80" width="150" height="50" rx="6" fill="#edf2f7" stroke="#4a5568"/><text x="105" y="110" text-anchor="middle">User submits credentials</text>
<rect x="220" y="80" width="150" height="50" rx="6" fill="#bee3f8" stroke="#2b6cb0"/><text x="295" y="110" text-anchor="middle">API validates via Identity</text>
<rect x="410" y="80" width="150" height="50" rx="6" fill="#bee3f8" stroke="#2b6cb0"/><text x="485" y="103" text-anchor="middle">Admin user?</text><text x="485" y="118" text-anchor="middle">Require TOTP MFA</text>
<rect x="600" y="80" width="150" height="50" rx="6" fill="#2b6cb0"/><text x="675" y="103" text-anchor="middle" fill="white">Issue JWT Access</text><text x="675" y="118" text-anchor="middle" fill="white">+ Refresh Token</text>
<rect x="790" y="80" width="130" height="50" rx="6" fill="#edf2f7" stroke="#4a5568"/><text x="855" y="110" text-anchor="middle">Client stores tokens</text>

<line x1="180" y1="105" x2="220" y2="105" stroke="#555" marker-end="url(#arrow)"/>
<line x1="370" y1="105" x2="410" y2="105" stroke="#555" marker-end="url(#arrow)"/>
<line x1="560" y1="105" x2="600" y2="105" stroke="#555" marker-end="url(#arrow)"/>
<line x1="750" y1="105" x2="790" y2="105" stroke="#555" marker-end="url(#arrow)"/>

<rect x="220" y="220" width="200" height="50" rx="6" fill="#edf2f7" stroke="#4a5568"/><text x="320" y="250" text-anchor="middle">Request with JWT header</text>
<rect x="470" y="220" width="200" height="50" rx="6" fill="#bee3f8" stroke="#2b6cb0"/><text x="570" y="245" text-anchor="middle">Token valid?</text><text x="570" y="260" text-anchor="middle">-&gt; Process request</text>
<line x1="855" y1="130" x2="320" y2="220" stroke="#555" marker-end="url(#arrow)"/>
<line x1="420" y1="245" x2="470" y2="245" stroke="#555" marker-end="url(#arrow)"/>

<rect x="220" y="340" width="200" height="55" rx="6" fill="#edf2f7" stroke="#4a5568"/><text x="320" y="365" text-anchor="middle">Access token expired</text><text x="320" y="382" text-anchor="middle">-&gt; use Refresh Token</text>
<rect x="470" y="340" width="200" height="55" rx="6" fill="#2b6cb0"/><text x="570" y="365" text-anchor="middle" fill="white">Issue new Access Token</text><text x="570" y="382" text-anchor="middle" fill="white">(rotate refresh token)</text>
<line x1="570" y1="270" x2="320" y2="340" stroke="#555" marker-end="url(#arrow)"/>
<line x1="420" y1="365" x2="470" y2="365" stroke="#555" marker-end="url(#arrow)"/>
</g>
<text x="475" y="460" text-anchor="middle" font-size="12" fill="#333">Account lockout after repeated failed attempts; every event written to Audit Log (Sec. 13).</text>
</svg>
