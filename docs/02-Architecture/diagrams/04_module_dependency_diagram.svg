<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="900" height="650" fill="#fafafa"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Module Dependency Diagram</text>

<rect x="360" y="70" width="180" height="45" rx="6" fill="#2b6cb0"/><text x="450" y="98" text-anchor="middle" fill="white" font-size="12">TheOne.API</text>
<rect x="200" y="170" width="180" height="45" rx="6" fill="#4299e1"/><text x="290" y="198" text-anchor="middle" fill="white" font-size="12">TheOne.McpServer</text>
<rect x="520" y="170" width="180" height="45" rx="6" fill="#4299e1"/><text x="610" y="198" text-anchor="middle" fill="white" font-size="12">TheOne.Worker</text>
<rect x="360" y="270" width="180" height="45" rx="6" fill="#63b3ed"/><text x="450" y="298" text-anchor="middle" fill="white" font-size="12">TheOne.Application</text>
<rect x="120" y="370" width="180" height="45" rx="6" fill="#90cdf4"/><text x="210" y="398" text-anchor="middle" font-size="12">TheOne.Infrastructure</text>
<rect x="360" y="370" width="180" height="45" rx="6" fill="#90cdf4"/><text x="450" y="398" text-anchor="middle" font-size="12">TheOne.Persistence</text>
<rect x="600" y="370" width="180" height="45" rx="6" fill="#90cdf4"/><text x="690" y="398" text-anchor="middle" font-size="12">TheOne.Identity</text>
<rect x="360" y="480" width="180" height="45" rx="6" fill="#2c5282"/><text x="450" y="508" text-anchor="middle" fill="white" font-size="12">TheOne.Domain</text>

<line x1="450" y1="115" x2="450" y2="270" stroke="#555" marker-end="url(#arrow)"/>
<line x1="380" y1="215" x2="440" y2="270" stroke="#555" marker-end="url(#arrow)"/>
<line x1="600" y1="215" x2="480" y2="270" stroke="#555" marker-end="url(#arrow)"/>
<line x1="380" y1="315" x2="250" y2="370" stroke="#555" marker-end="url(#arrow)"/>
<line x1="450" y1="315" x2="450" y2="370" stroke="#555" marker-end="url(#arrow)"/>
<line x1="520" y1="315" x2="650" y2="370" stroke="#555" marker-end="url(#arrow)"/>
<line x1="450" y1="315" x2="450" y2="480" stroke="#555" marker-end="url(#arrow)"/>
<line x1="210" y1="415" x2="400" y2="480" stroke="#555" marker-end="url(#arrow)"/>
<line x1="450" y1="415" x2="450" y2="480" stroke="#555" marker-end="url(#arrow)"/>
<line x1="690" y1="415" x2="500" y2="480" stroke="#555" marker-end="url(#arrow)"/>
<text x="450" y="600" text-anchor="middle" font-size="12" fill="#333">Arrows show "depends on" direction — all layers ultimately depend on Domain, never the reverse.</text>
</svg>
